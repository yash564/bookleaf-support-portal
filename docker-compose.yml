services:
  db:
    image: postgres:16-alpine
    container_name: bookleaf-db
    environment:
      POSTGRES_USER: bookleaf
      POSTGRES_PASSWORD: bookleaf
      POSTGRES_DB: bookleaf
    ports:
      - "5433:5432"
    volumes:
      - bookleaf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookleaf -d bookleaf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bookleaf_pgdata:
